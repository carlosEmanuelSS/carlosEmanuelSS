name: Dev Dashboard Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate languages panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage
          plugin_languages_colors: github
          config_timezone: America/Sao_Paulo

      - name: Generate activity panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/activity.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: America/Sao_Paulo

      - name: Commit generated dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg assets/activity.svg 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update dev dashboard metrics"
          git push
